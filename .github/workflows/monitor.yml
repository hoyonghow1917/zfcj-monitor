name: Monitor ZFCJ

on:
  schedule:
    # UTC 时间 1:00 = 北京时间 9:00
    - cron: '0 1 * * *'
  workflow_dispatch:   # 允许手动点击运行，方便测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 由于要安装浏览器，稍微放宽超时时间
    permissions:
      contents: write    # 允许提交 seen.json

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖和浏览器
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: 运行监控脚本
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_USERID: ${{ secrets.WX_USERID }}
          WX_TEMPLATE_ID: ${{ secrets.WX_TEMPLATE_ID }}
        run: python monitor.py

      - name: 保存 seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "更新 seen.json"
            git push
          fi
